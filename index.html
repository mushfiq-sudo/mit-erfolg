<script>
'use strict';
/* =================================================================
   2) SCORING LOGIC  (separate from UI)
   ================================================================= */
const BOOK = JSON.parse(document.getElementById('book-data').textContent);
const DEMO = JSON.parse(document.getElementById('demo-data').textContent).tasks;
const MODS = BOOK.modules, MODKEYS = ['lesen','hoeren','schreiben','sprechen'];

const Scoring = {
  // answer may be 0-based index or a letter ("a","b",…); returns index or null (= no key available)
  key(q){const a=q.answer;if(a==null||a==='')return null;if(typeof a==='number')return a;
    const s=String(a).trim().toLowerCase();if(/^[a-z]$/.test(s))return s.charCodeAt(0)-97;const i=parseInt(s,10);return isNaN(i)?null:i;},
  summary(tasks,ans){let c=0,keyed=0,answered=0,total=0;
    tasks.forEach(t=>(t.questions||[]).forEach((q,qi)=>{total++;const k=Scoring.key(q),s=(ans[t.id]||{})[qi];
      if(s!=null)answered++;if(k!=null){keyed++;if(s===k)c++;}}));
    return {correct:c,keyed,answered,total};},
  // official conversion only if all 30 questions have a key (1 Messpunkt each – assumption stated in UI)
  official(mod,sum){if((mod!=='lesen'&&mod!=='hoeren')||sum.total!==30||sum.keyed!==30)return null;
    return {messpunkte:sum.correct,ergebnis:BOOK.conversion[String(sum.correct)],passed:sum.correct>=18};},
  pages(mt,mod){const m=BOOK.modelltests[mt-1];if(!m)return null;
    const order=['lesen','hoeren','schreiben','sprechen','loesungen'];const i=order.indexOf(mod);
    return {from:m[mod],to:(i<order.length-1?m[order[i+1]]-1:m.end)};}
};

/* =================================================================
   3) STORE (localStorage, with in-memory fallback)
   ================================================================= */
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const S=Object.assign({answers:{},checked:{},exam:{},results:[],bookmarks:[],done:{},writing:{},checks:{},notes:{},vocab:[],theme:null},LS.get('gb2.state',{}));
let C=LS.get('gb2.content',{tasks:[]}); if(!Array.isArray(C.tasks))C.tasks=[];
const save=()=>LS.set('gb2.state',S), saveC=()=>LS.set('gb2.content',C);
const allTasks=()=>DEMO.concat(C.tasks);
const tasksFor=(mt,mod,teil)=>allTasks().filter(t=>t.mt===mt&&t.module===mod&&(teil==null||t.teil===teil));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=(s,e)=>(e||document).querySelector(s);
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const modColor=m=>'var(--c-'+m+')';
const AUDIO={}, RECS={}; let PDF={url:null,name:'',page:null}; let REC=null; const FLIPPED=new Set();

/* =================================================================
   4) UI HELPERS
   ================================================================= */
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2800);}
function copyText(txt,msg){const done=()=>toast(msg||'Copied');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,()=>fallback());}else fallback();
  function fallback(){try{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();ok?done():toast('Copy blocked – select the text manually');}catch(e){toast('Copy blocked – select the text manually');}}}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.15;o.start();setTimeout(()=>{o.stop();a.close()},700);}catch(e){}}
const TM={};
function tm(id,secs,label){const t=TM[id]||(TM[id]={left:secs,total:secs,run:false});t.label=label||t.label||'';return t;}
function timerHTML(id,label,secs){const t=tm(id,secs,label);
  return `<div class="timer"><div class="tl">⏱ ${esc(label)}</div><div class="tt${t.left<=60&&t.total>120?' warn':''}" data-timer="${id}">${fmt(t.left)}</div>
  <div class="tb"><button class="btn sm" data-act="tstart" data-id="${id}">${t.run?'Pause':(t.left<t.total&&t.left>0?'Resume':'Start')}</button><button class="btn sm ghost" data-act="treset" data-id="${id}">Reset</button></div></div>`;}
setInterval(()=>{let fin=false;for(const id in TM){const t=TM[id];if(t.run&&t.left>0){t.left--;if(t.left===0){t.run=false;fin=true;beep();toast('⏰ Time is up: '+t.label);}}}
  document.querySelectorAll('[data-timer]').forEach(el=>{const t=TM[el.dataset.timer];if(t){el.textContent=fmt(t.left);el.classList.toggle('warn',t.left<=60&&t.total>120);}});
  if(fin)render(true);},1000);

/* =================================================================
   5) COMPONENT RENDERERS
   ================================================================= */
function pdfBtn(printed,label){return `<button class="btn sm ghost" data-act="pdfgo" data-p="${printed}">📄 ${esc(label||('Book p. '+printed))}</button>`;}
function pagesLabel(mt,mod){const p=Scoring.pages(mt,mod);return p?(p.from===p.to?'p. '+p.from:'pp. '+p.from+'–'+p.to):'';}
function doneTask(t){if(t.questions)return !!S.checked[t.id]||!!(S.exam[t.mt+'-'+t.module]||{}).submitted;return !!S.done[t.id];}
function moduleProgress(mod){const ts=allTasks().filter(t=>t.module===mod&&!t.demo);return {n:ts.length,d:ts.filter(doneTask).length};}
function slotsFilled(){let f=0,tot=0;BOOK.modelltests.forEach(m=>MODKEYS.forEach(k=>MODS[k].teile.forEach(te=>{tot++;if(tasksFor(m.n,k,te.n).length)f++;})));return {f,tot};}
const ansStore=ctx=>ctx==='p'?S.answers:((S.exam[ctx.slice(2)]=S.exam[ctx.slice(2)]||{ans:{},submitted:false}).ans);

function questionHTML(t,q,qi,ctx,reveal){
  const ans=ansStore(ctx),sel=(ans[t.id]||{})[qi],k=Scoring.key(q),bk=t.id+':'+qi,bm=S.bookmarks.includes(bk);
  const opts=(q.options||[]).map((o,oi)=>{let c='opt';if(sel===oi)c+=' sel';if(reveal&&k!=null){if(oi===k)c+=' ok';else if(sel===oi)c+=' bad';}
    return `<button class="${c}" data-act="pick" data-ctx="${ctx}" data-t="${esc(t.id)}" data-q="${qi}" data-o="${oi}" aria-pressed="${sel===oi}" ${reveal?'disabled':''}><b>${String.fromCharCode(97+oi)}</b><span>${esc(o)}</span></button>`;}).join('');
  let fb='';if(reveal){if(k==null)fb='<div class="expl">No answer key available for this question.</div>';
    else fb=`<div class="expl">${sel===k?'✅ Correct.':(sel==null?'⚠️ Not answered.':'❌ Not correct.')} Answer: <b>${String.fromCharCode(97+k)}</b>${q.explanation?' – '+esc(q.explanation):''}</div>`;}
  return `<div class="q"><div class="qh"><div><span class="qn">${esc(q.n!=null?q.n:qi+1)}.</span> ${esc(q.q||'')}</div>
    <button class="star${bm?' on':''}" data-act="bm" data-k="${esc(bk)}" aria-label="Bookmark question" title="Bookmark">${bm?'★':'☆'}</button></div>
    <div class="opts">${opts}</div>${fb}</div>`;
}

function audioBlock(t){
  const src=AUDIO[t.id]||(/\.(mp3|m4a|ogg|wav)$/i.test(t.audio||'')?t.audio:null);
  return `<div class="note w" style="margin:10px 0">🎧 ${t.audio&&!src?'Book audio: <b>'+esc(t.audio)+'</b>. ':''}
   ${src?`<audio controls preload="metadata" src="${esc(src)}" id="au-${esc(t.id)}" style="width:100%;margin:6px 0"></audio>
   <div class="row"><button class="btn sm ghost" data-act="aseek" data-t="${esc(t.id)}" data-d="-10">⟲ 10 s</button><button class="btn sm ghost" data-act="aseek" data-t="${esc(t.id)}" data-d="0">⏮ Replay</button>
   <label class="meta">Speed <select data-change="arate" data-t="${esc(t.id)}" style="width:auto;padding:4px 8px"><option>0.75</option><option selected>1</option><option>1.25</option></select></label></div>`
   :'No audio attached yet – this needs your authorized audio file. '}
   <div style="margin-top:6px"><label class="btn sm ghost" style="cursor:pointer">📎 ${src?'Replace':'Attach'} audio file<input type="file" accept="audio/*" data-change="aattach" data-t="${esc(t.id)}" hidden></label></div></div>`;
}

function taskHTML(t,ctx,reveal){
  const m=MODS[t.module];let h=`<article class="card" style="--mc:${modColor(t.module)};margin-top:14px" id="task-${esc(t.id)}">
  <div class="row"><span class="pill">${m.icon} ${m.name} · Teil ${t.teil}</span>${t.demo?'<span class="pill demo">Demo – not from the book</span>':'<span class="pill">Your imported content</span>'}</div>
  <h3 style="margin-top:8px">${esc(t.title||(m.name+' Teil '+t.teil))}</h3>`;
  if(t.instruction)h+=`<p class="instr">${esc(t.instruction)}</p>`;
  if(t.module==='hoeren')h+=audioBlock(t);
  if(t.text)h+=`<div class="passage">${esc(t.text)}</div>`;
  if(t.prompt)h+=`<div class="passage">${esc(t.prompt)}</div>`;
  (t.questions||[]).forEach((q,qi)=>{h+=questionHTML(t,q,qi,ctx,reveal);});
  if(t.module==='hoeren'&&t.transcript&&reveal)h+=`<details class="expl"><summary><b>Transcript</b></summary><div class="passage">${esc(t.transcript)}</div></details>`;
  if(t.questions&&ctx==='p'){const s=Scoring.summary([t],S.answers);
    h+=`<div class="row" style="margin-top:12px">${S.checked[t.id]?`<span class="pill">${s.correct}/${s.keyed||s.total} correct</span><button class="btn sm ghost" data-act="uncheck" data-t="${esc(t.id)}">Try again</button>`
     :`<button class="btn sm" data-act="check" data-t="${esc(t.id)}">Check answers</button>`}</div>`;}
  if(!t.questions&&ctx==='p')h+=`<div class="row"><button class="btn sm ${S.done[t.id]?'ghost':''}" data-act="done" data-t="${esc(t.id)}">${S.done[t.id]?'✓ Done (undo)':'Mark as done'}</button></div>`;
  return h+'</article>';
}

const EXPRESS={
  'Presenting (Teil 1)':['Ich möchte Ihnen heute das Thema … vorstellen.','Zuerst möchte ich auf … eingehen.','Ein weiterer wichtiger Punkt ist …','Zum Schluss fasse ich kurz zusammen: …','Vielen Dank für Ihre Aufmerksamkeit.'],
  'Discussing (Teil 2)':['Ich bin der Meinung, dass …','Da stimme ich Ihnen (nicht) zu, weil …','Einerseits …, andererseits …','Das ist ein guter Punkt, aber …','Ich sehe das anders, denn …','Könnten Sie das bitte genauer erklären?']};
const CHECKS={
  schreiben:['I answered every point of the task','Greeting / closing fit the text type','Clear structure with paragraphs and linking words (z. B. deshalb, außerdem, trotzdem)','Verb position, cases and endings checked','Varied vocabulary (no repeated words)','Spelling and punctuation checked','Length is appropriate for the task']};

function writingTool(mt,teil){
  const key=mt+'-'+teil,txt=S.writing[key]||'',tasks=tasksFor(mt,'schreiben',teil);
  const wc=txt.trim()?txt.trim().split(/\s+/).length:0;
  let h=`<section class="card" style="--mc:var(--c-schreiben);margin-top:14px"><h3>Writing area – Teil ${teil}</h3>`;
  if(tasks.length)tasks.forEach(t=>{h+=`<p class="instr">${esc(t.title||'')}</p>${t.instruction?`<p>${esc(t.instruction)}</p>`:''}<div class="passage">${esc(t.prompt||t.text||'')}</div>`;});
  else h+=`<div class="note w">Task text not added yet. Open the book page in the PDF viewer, or add your own text under “Content”.</div>`;
  h+=`<textarea class="ed" data-bind="writing" data-key="${key}" rows="12" aria-label="Your text" placeholder="Schreiben Sie hier …" spellcheck="true" lang="de">${esc(txt)}</textarea>
  <div class="row" style="margin-top:8px"><span class="pill" id="wc-${key}">${wc} words</span>
  <button class="btn sm ghost" data-act="aifb" data-key="${key}">🤖 Copy text + AI-feedback prompt</button></div>
  <p class="meta">AI feedback is <b>supplementary</b> and not an official rating. Paste the copied text into a Claude chat to get comments on grammar, vocabulary, coherence and task completion.</p>
  <h3 style="margin-top:16px">Self-review checklist</h3>`;
  CHECKS.schreiben.forEach((c,i)=>{const id=key+':'+i;h+=`<label class="check"><input type="checkbox" data-change="chk" data-id="${id}" ${S.checks[id]?'checked':''}><span>${esc(c)}</span></label>`;});
  return h+'</section>';
}
function speakingTool(mt,teil){
  const key=mt+'-'+teil,te=MODS.sprechen.teile[teil-1],tasks=tasksFor(mt,'sprechen',teil);
  let h=`<section class="card" style="--mc:var(--c-sprechen);margin-top:14px"><h3>Speaking practice – Teil ${teil}: ${esc(te.goal)}</h3><p class="meta">${esc(te.note)} · Vorbereitung: 15 Minuten</p>`;
  if(tasks.length)tasks.forEach(t=>{h+=`<p class="instr">${esc(t.title||'')}</p>${t.instruction?`<p>${esc(t.instruction)}</p>`:''}<div class="passage">${esc(t.prompt||t.text||'')}</div>`;});
  else h+=`<div class="note w">Topic not added yet. Open the book page in the PDF viewer, or add your own topic under “Content”.</div>`;
  h+=`<div class="grid g2">${timerHTML('prep-'+key,'Preparation (15 min)',900)}${timerHTML('speak-'+key,'Speaking (Teil '+teil+')',te.speak*60)}</div>
  <h3>Notes</h3><textarea data-bind="notes" data-key="${key}" rows="6" aria-label="Notes" placeholder="Stichpunkte …" lang="de">${esc(S.notes[key]||'')}</textarea>
  <h3 style="margin-top:16px">Useful expressions <span class="srcb">(extra material, not from the book)</span></h3>`;
  const grp=teil===1?'Presenting (Teil 1)':'Discussing (Teil 2)';
  h+=`<ul>${EXPRESS[grp].map(e=>`<li lang="de">${esc(e)}</li>`).join('')}</ul><h3>Voice recording (optional)</h3>`;
  if(window.MediaRecorder&&navigator.mediaDevices){const r=REC&&REC.id===key;
    h+=`<div class="row"><button class="btn sm ${r?'danger':''}" data-act="${r?'recstop':'recstart'}" data-key="${key}">${r?'⏹ Stop':'⏺ Record'}</button>${RECS[key]?`<audio controls src="${RECS[key]}"></audio>`:''}</div><p class="meta">Recordings stay on your device and are lost when you close the page.</p>`;}
  else h+='<p class="meta">Recording is not supported in this browser.</p>';
  return h+'</section>';
}

let UI={key:'',mode:'practice',teil:1,screen:'work'};
function viewTestModule(n,k,teilArg){
  const book=n===0?null:BOOK.modelltests[n-1];const m=MODS[k];if(!m||(n!==0&&!book))return viewNotFound();
  const key=n+'-'+k,rk=location.hash;
  if(UI.key!==rk){UI={key:rk,mode:'practice',teil:teilArg||1,screen:'work'};}
  const ex=S.exam[key]||(S.exam[key]={ans:{},submitted:false});
  const scored=(k==='lesen'||k==='hoeren');
  let h=`<div class="crumb"><a href="#/">Home</a> › <a href="#/t/${n}">Modelltest ${n||'Demo'}</a> › ${m.name}</div>
  <div class="pagehead" style="--mc:${modColor(k)}"><h1>${m.icon} ${m.name} – ${n?'Modelltest '+n:'Demo'}</h1>
  <div class="row"><span class="meta">${n?'Book '+pagesLabel(n,k):''}</span>${n?pdfBtn(book[k],'Open in PDF viewer'):''}</div></div><div style="--mc:${modColor(k)}">`;
  // Teil navigation
  h+=`<div class="chips" role="tablist" aria-label="Teile">`+m.teile.map(t=>{const c=tasksFor(n,k,t.n).length;return `<button class="chip${UI.teil===t.n?' on':''}" data-act="teil" data-n="${t.n}">Teil ${t.n}${c?' · '+c:''}</button>`;}).join('')+`</div>`;
  if(scored){
    h+=`<div class="row" style="margin-top:14px"><div class="seg" role="group" aria-label="Mode"><button class="${UI.mode==='practice'?'on':''}" data-act="mode" data-m="practice">Practice</button><button class="${UI.mode==='exam'?'on':''}" data-act="mode" data-m="exam">Exam mode</button></div></div>`;
    if(UI.mode==='exam')h+=timerHTML('exam-'+key,m.name+' – '+m.minutes+' minutes',m.minutes*60);
  }
  const te=m.teile[UI.teil-1];
  if(te)h+=`<div class="note" style="margin-top:10px"><b>Teil ${te.n}:</b> ${esc(te.goal)}${te.sug?' · suggested '+te.sug+' min':''}${te.pts!=null?' · '+te.pts+' points':''}</div>`;

  if(k==='schreiben'){h+=timerHTML('write-'+key,'Writing – 75 minutes total (suggested: Teil 1 = 50, Teil 2 = 25)',75*60)+writingTool(n,UI.teil)+tasksFor(n,k,UI.teil).filter(t=>t.questions).map(t=>taskHTML(t,'p',!!S.checked[t.id])).join('');return h+'</div>';}
  if(k==='sprechen'){h+=speakingTool(n,UI.teil);return h+'</div>';}

  const exam=UI.mode==='exam';
  const ctx=exam?'e:'+key:'p';
  if(exam&&ex.submitted)return h+resultHTML(n,k,ex)+'</div>';
  if(exam&&UI.screen==='review')return h+reviewHTML(n,k,ex)+'</div>';

  const ts=tasksFor(n,k,UI.teil);
  if(!ts.length)h+=`<div class="empty" style="margin-top:14px">No content for ${m.name} Teil ${UI.teil} yet.<br>${n?'Open '+pagesLabel(n,k)+' in the PDF viewer, and add your authorized tasks under <a href="#/content">Content</a>.':''}</div>`;
  ts.forEach(t=>{h+=exam?taskHTML(t,ctx,false):taskHTML(t,'p',!!S.checked[t.id]);});
  if(exam){const last=UI.teil>=m.teile.length;
    h+=`<div class="row" style="margin-top:16px">${UI.teil>1?`<button class="btn ghost" data-act="teil" data-n="${UI.teil-1}">← Teil ${UI.teil-1}</button>`:''}${!last?`<button class="btn" data-act="teil" data-n="${UI.teil+1}">Teil ${UI.teil+1} →</button>`:''}<button class="btn" data-act="review">Review &amp; submit</button></div>`;}
  return h+'</div>';
}
function examTasks(n,k){return allTasks().filter(t=>t.mt===n&&t.module===k&&t.questions);}
function reviewHTML(n,k,ex){
  const m=MODS[k],ts=examTasks(n,k);let h=`<section class="card" style="margin-top:14px"><h3>Review before submitting</h3>`;
  if(!ts.length)h+='<p>No tasks with questions are loaded for this module, so there is nothing to submit.</p>';
  m.teile.forEach(te=>{const tt=ts.filter(t=>t.teil===te.n);if(!tt.length)return;let tot=0,ans=0,miss=[];
    tt.forEach(t=>(t.questions||[]).forEach((q,qi)=>{tot++;if(((ex.ans[t.id]||{})[qi])!=null)ans++;else miss.push(q.n!=null?q.n:qi+1);}));
    h+=`<div class="row" style="padding:8px 0;border-top:1px solid var(--line)"><b>Teil ${te.n}</b><span class="pill">${ans}/${tot} answered</span>${miss.length?`<span class="meta grow">Open: ${miss.join(', ')}</span>`:'<span class="meta grow">All answered ✓</span>'}<button class="btn sm ghost" data-act="teil" data-n="${te.n}" data-back="1">Go to Teil</button></div>`;});
  return h+`<div class="row" style="margin-top:14px"><button class="btn ghost" data-act="backwork">← Back</button><button class="btn" data-act="submit" ${ts.length?'':'disabled'}>Submit exam section</button></div></section>`;
}
function resultHTML(n,k,ex){
  const ts=examTasks(n,k),sum=Scoring.summary(ts,ex.ans),off=Scoring.official(k,sum),pct=sum.keyed?Math.round(sum.correct/sum.keyed*100):0;
  let h=`<section class="card" style="margin-top:14px" aria-live="polite"><h3>Result</h3><div class="big-num">${sum.correct}<span class="meta"> / ${sum.keyed||sum.total} correct</span></div>
  <div class="prog"><i style="width:${pct}%"></i></div><p class="meta">${pct}% of the questions that have an answer key${sum.keyed<sum.total?' ('+(sum.total-sum.keyed)+' question(s) without key were not scored)':''}.</p>`;
  if(off)h+=`<div class="note"><b>${off.messpunkte}</b> Messpunkte → <b>${off.ergebnis}</b> Ergebnispunkte (book table, p. 6). ${off.passed?'✅ At or above the pass mark (18 Messpunkte / 60).':'❌ Below the pass mark (18 Messpunkte / 60).'}<br><span class="meta">Assumes 1 Messpunkt per question for all 30 questions.</span></div>`;
  else h+=`<div class="note w">An official score is only shown when all 30 questions of Lesen / Hören are loaded with answer keys. This is a practice score only.</div>`;
  h+=`<div class="row" style="margin-top:12px"><button class="btn ghost" data-act="retake">Start again</button></div></section>`;
  ts.forEach(t=>{h+=taskHTML(t,'e:'+n+'-'+k,true);});return h;
}

let SQ={q:'',mod:'',mt:'',teil:''};
function searchResults(){
  const q=SQ.q.trim().toLowerCase(),out=[];
  BOOK.modelltests.forEach(m=>MODKEYS.forEach(k=>MODS[k].teile.forEach(te=>{
    if(SQ.mod&&SQ.mod!==k)return;if(SQ.mt!==''&&+SQ.mt!==m.n)return;if(SQ.teil&&+SQ.teil!==te.n)return;
    const label=`${MODS[k].name} Modelltest ${m.n} Teil ${te.n} ${te.goal}`.toLowerCase();
    if(!q||label.includes(q)){const n=tasksFor(m.n,k,te.n).length;out.push(`<a class="card mcard" style="margin-top:10px;--mc:${modColor(k)}" href="#/t/${m.n}/${k}/${te.n}"><b>${MODS[k].icon} ${MODS[k].name} · Modelltest ${m.n} · Teil ${te.n}</b><div class="meta">${esc(te.goal)} · ${n?n+' task(s)':'no content yet'}</div></a>`);}})));
  allTasks().forEach(t=>{if(SQ.mod&&SQ.mod!==t.module)return;if(SQ.mt!==''&&+SQ.mt!==t.mt)return;if(SQ.teil&&+SQ.teil!==t.teil)return;
    const blob=[t.title,t.instruction,t.text,t.prompt].concat((t.questions||[]).map(x=>x.q+' '+(x.options||[]).join(' '))).join(' ').toLowerCase();
    if(q&&blob.includes(q))out.push(`<a class="card mcard" style="margin-top:10px;--mc:${modColor(t.module)}" href="#/t/${t.mt}/${t.module}/${t.teil}"><b>${esc(t.title||'Task')}</b><div class="meta">Text match · ${MODS[t.module].name} · ${t.mt?'MT '+t.mt:'Demo'} · Teil ${t.teil}</div></a>`);});
  return out.length?out.join(''):'<div class="empty" style="margin-top:12px">Nothing found.</div>';
}

function route(){
  const p=(location.hash||'#/').split('/').slice(1);
  switch(p[0]){
    case '':case undefined:return viewHome();
    case 'm':return viewModule(p[1]);
    case 't':{const n=+p[1];if(isNaN(n))return viewNotFound();if(p[2])return viewTestModule(n,p[2],p[3]?+p[3]:null);return viewTest(n);}
    case 'dash':return viewDash();case 'bm':return viewBookmarks();case 'search':return viewSearch();
    case 'vocab':return viewVocab();case 'pdf':return viewPdf();case 'content':return viewContent();case 'help':return viewHelp();
    default:return viewNotFound();}
}
function render(keepScroll){const y=window.scrollY;$('#app').innerHTML=route();renderNav();if(keepScroll===true)window.scrollTo(0,y);}

const nowStr=()=>new Date().toLocaleString();
const H={
  scrollmods(b,e){e.preventDefault();const el=$('#modules');if(el)el.scrollIntoView({behavior:'smooth'});},
  pick(b){const a=ansStore(b.dataset.ctx),t=b.dataset.t;(a[t]=a[t]||{})[b.dataset.q]=+b.dataset.o;
    if(b.dataset.ctx==='p'&&S.checked[t])delete S.checked[t];save();render(true);},
  check(b){S.checked[b.dataset.t]=true;save();render(true);},
  uncheck(b){delete S.checked[b.dataset.t];delete S.answers[b.dataset.t];save();render(true);},
  done(b){const t=b.dataset.t;S.done[t]=!S.done[t];save();render(true);},
  bm(b){const k=b.dataset.k,i=S.bookmarks.indexOf(k);i>=0?S.bookmarks.splice(i,1):S.bookmarks.push(k);save();render(true);},
  teil(b){UI.teil=+b.dataset.n;UI.screen='work';render();window.scrollTo(0,0);},
  mode(b){UI.mode=b.dataset.m;UI.screen='work';render(true);},
  review(){UI.screen='review';render();window.scrollTo(0,0);},
  backwork(){UI.screen='work';render();},
  submit(){const [n,k]=UI.key.split('/').slice(2,4);const key=n+'-'+k,ex=S.exam[key];if(!ex)return;
    const sum=Scoring.summary(examTasks(+n,k),ex.ans),off=Scoring.official(k,sum);ex.submitted=true;
    S.results.unshift({mt:+n,mod:k,c:sum.correct,keyed:sum.keyed,total:sum.total,ep:off?off.ergebnis:null,date:nowStr()});S.results=S.results.slice(0,60);
    TM['exam-'+key]&&(TM['exam-'+key].run=false);save();render();window.scrollTo(0,0);},
  retake(){const [n,k]=UI.key.split('/').slice(2,4);delete S.exam[n+'-'+k];const t=TM['exam-'+n+'-'+k];if(t){t.left=t.total;t.run=false;}UI.screen='work';UI.teil=1;save();render();window.scrollTo(0,0);},
  tstart(b){const t=TM[b.dataset.id];if(!t)return;if(t.left===0)t.left=t.total;t.run=!t.run;render(true);},
  treset(b){const t=TM[b.dataset.id];if(!t)return;t.left=t.total;t.run=false;render(true);},
  pdfgo(b){PDF.page=+b.dataset.p;location.hash='#/pdf';if(location.hash==='#/pdf')render();},
  aseek(b){const a=document.getElementById('au-'+b.dataset.t);if(!a)return;const d=+b.dataset.d;if(d===0){a.currentTime=0;a.play();}else a.currentTime=Math.max(0,a.currentTime+d);},
  aifb(b){const key=b.dataset.key,txt=S.writing[key]||'';if(!txt.trim()){toast('Write something first');return;}
    copyText('Please give me feedback on my Goethe-Zertifikat B2 writing task (supplementary, not an official rating). Comment on: 1) task completion, 2) coherence and structure, 3) vocabulary, 4) grammar and spelling. Show corrected sentences and explain the main mistakes simply.\n\nMy text:\n'+txt,'Copied – paste it into a Claude chat');},
  async recstart(b){const key=b.dataset.key;try{const st=await navigator.mediaDevices.getUserMedia({audio:true});const mr=new MediaRecorder(st),ch=[];
      mr.ondataavailable=e=>ch.push(e.data);mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());RECS[key]=URL.createObjectURL(new Blob(ch,{type:mr.mimeType||'audio/webm'}));REC=null;render(true);};
      mr.start();REC={id:key,mr};render(true);}catch(err){toast('Recording not available here: '+(err.name||'error'));}},
  recstop(){if(REC&&REC.mr.state!=='inactive')REC.mr.stop();},
  deltask(b){C.tasks.splice(+b.dataset.i,1);saveC();render(true);},
  clearcontent(){if(confirm('Delete all imported tasks?')){C.tasks=[];saveC();render(true);}},
  tpl(){$('#imp').value=JSON.stringify(TEMPLATE,null,2);},
  import(){doImport($('#imp').value);},
  vadd(){const de=$('#vde').value.trim(),en=$('#ven').value.trim(),ur=$('#vur').value.trim();if(!de||!en){toast('Enter German and English');return;}S.vocab.unshift({de,en,ur});save();render(true);},
  vbulk(){const ls=$('#vbulk').value.split('\n').map(l=>l.split(';').map(x=>x.trim())).filter(a=>a[0]&&a[1]);ls.forEach(a=>S.vocab.unshift({de:a[0],en:a[1],ur:a[2]||''}));save();toast(ls.length+' words added');render(true);},
  vdel(b){S.vocab.splice(+b.dataset.i,1);FLIPPED.clear();save();render(true);},
  flip(b){const i=+b.dataset.i;FLIPPED.has(i)?FLIPPED.delete(i):FLIPPED.add(i);b.classList.toggle('on');},
  exportstate(){const j=JSON.stringify({state:S,content:C});$('#bk').value=j;copyText(j,'Backup copied');},
  importstate(){try{const o=JSON.parse($('#bk').value);if(o.state)Object.assign(S,o.state);if(o.content&&Array.isArray(o.content.tasks)){C=o.content;saveC();}save();toast('Backup restored');render(true);}catch(e){toast('Invalid backup');}},
  resetstate(){if(confirm('Reset all progress (imported tasks are kept)?')){Object.assign(S,{answers:{},checked:{},exam:{},results:[],bookmarks:[],done:{},writing:{},checks:{},notes:{}});save();render(true);}}
};
function doImport(txt){let o;try{o=JSON.parse(txt);}catch(e){toast('Invalid JSON: '+e.message);return;}
  const arr=Array.isArray(o)?o:o.tasks;if(!Array.isArray(arr)){toast('Expected {"tasks":[…]}');return;}
  const errs=[];let ok=0;arr.forEach((t,i)=>{
    if(!t||!t.id||!MODS[t.module]||![1,2,3,4].includes(+t.mt)||!MODS[t.module].teile.some(x=>x.n===+t.teil)){errs.push('#'+(i+1)+' needs id, mt (1-4), module, valid teil');return;}
    if(t.questions&&!t.questions.every(q=>Array.isArray(q.options)&&q.options.length>=2)){errs.push('#'+(i+1)+' (“'+t.id+'”): each question needs ≥2 options');return;}
    t.mt=+t.mt;t.teil=+t.teil;const j=C.tasks.findIndex(x=>x.id===t.id);j>=0?C.tasks[j]=t:C.tasks.push(t);ok++;});
  saveC();toast(ok+' task(s) imported'+(errs.length?' · '+errs.length+' skipped':''));if(errs.length)alert(errs.join('\n'));render(true);}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=H[b.dataset.act];if(f)f(b,e);});
document.addEventListener('change',e=>{const el=e.target.closest('[data-change]');if(!el)return;const a=el.dataset.change;
  if(a==='chk'){S.checks[el.dataset.id]=el.checked;save();}
  else if(a==='sf'){SQ[el.dataset.f]=el.value;$('#sr').innerHTML=searchResults();}
  else if(a==='arate'){const au=document.getElementById('au-'+el.dataset.t);if(au)au.playbackRate=+el.value;}
  else if(a==='aattach'){const f=el.files[0];if(!f)return;AUDIO[el.dataset.t]=URL.createObjectURL(f);toast('Audio attached: '+f.name);render(true);}
  else if(a==='pdfload'){const f=el.files[0];if(!f)return;if(PDF.url)URL.revokeObjectURL(PDF.url);PDF.url=URL.createObjectURL(f);PDF.name=f.name;render(true);}
  else if(a==='impfile'){const f=el.files[0];if(!f)return;f.text().then(doImport);}});
let sv;document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.bind){const st=el.dataset.bind==='writing'?S.writing:S.notes;st[el.dataset.key]=el.value;
    if(el.dataset.bind==='writing'){const w=el.value.trim()?el.value.trim().split(/\s+/).length:0;const c=document.getElementById('wc-'+el.dataset.key);if(c)c.textContent=w+' words';}
    clearTimeout(sv);sv=setTimeout(save,400);}
  else if(el.dataset.input==='sq'){SQ.q=el.value;$('#sr').innerHTML=searchResults();}
  else if(el.dataset.input==='vq'){SQ.v=el.value;const pos=el.selectionStart;render(true);const n=$('[data-input="vq"]');if(n){n.focus();n.setSelectionRange(pos,pos);}}});
$('#burger').addEventListener('click',()=>{const m=$('#mob');const o=m.classList.toggle('open');$('#burger').setAttribute('aria-expanded',o);});
function applyTheme(){if(S.theme)document.documentElement.setAttribute('data-theme',S.theme);else document.documentElement.removeAttribute('data-theme');}
$('#themeBtn').addEventListener('click',()=>{const dark=S.theme?S.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;S.theme=dark?'light':'dark';save();applyTheme();});
applyTheme();
if(location.hash==='#modules')location.hash='#/';
render();
</script>
</body>
